name: OpenSSF Scorecard

# Continuous supply-chain security score from the OpenSSF Scorecard project.
# Runs on a weekly schedule, on pushes to main, and when branch protection
# rules change (so changes to protection surface in the next score).

on:
  push:
    branches: ["main"]
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Upload SARIF to the Security tab.
      id-token: write           # Publish results to scorecard.dev (OIDC).
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
