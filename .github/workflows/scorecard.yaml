name: OpenSSF Scorecard

# Continuous supply-chain security score from the OpenSSF Scorecard project.
# Runs on a weekly schedule, on pushes to main, and when branch protection
# rules change (so changes to protection surface in the next score).

on:
  push:
    branches: ["main"]
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Upload SARIF to the Security tab.
      id-token: write           # Publish results to scorecard.dev (OIDC).
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: scorecard
