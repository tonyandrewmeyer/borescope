name: Dependency review

# Fails a PR that introduces a known-vulnerable transitive dependency before
# merge — complements Dependabot's after-the-fact PRs and the OSV-Scanner
# sweep over the locked tree.

on:
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # Allow the action to comment on the PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: high
